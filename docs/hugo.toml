baseURL = "https://devcrocod.github.io/simdjson-kotlin/"
title = "simdjson-kotlin"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.en]
    locale = "en-us"
    weight = 1

[params]
  version = "0.1.0"
  description = "Kotlin Multiplatform JSON parser based on simdjson"
  github = "https://github.com/devcrocod/simdjson-kotlin"

[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFULL"]
  section = ["HTML", "RSS", "MD"]
  page = ["HTML", "MD"]

[module]
  [[module.imports]]
    path = "github.com/devcrocod/kotlin-docs-kit/packages/hugo"

[markup]
  [markup.highlight]
    codeFences = true
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "github"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[[menus.main]]
  name = "Getting started"
  url = "/getting-started/"
  weight = 10

[[menus.main]]
  name = "Guides"
  url = "/guides/"
  weight = 20

[[menus.main]]
  name = "Examples"
  url = "/examples/"
  weight = 30
