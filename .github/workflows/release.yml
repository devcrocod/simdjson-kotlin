name: Release to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-natives:
    uses: ./.github/workflows/build-natives.yml

  publish:
    needs: build-natives
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage native libraries
        run: |
          # actions/upload-artifact roots each artifact at the least-common-ancestor
          # of its paths, so the simdjson-native/ prefix (and, for single-file
          # artifacts, the whole directory) is stripped. Reconstruct the layout the
          # Gradle publish expects. Host-native libraries (macos-arm64 JNI, macOS/iOS
          # Kotlin/Native .a) are rebuilt on this runner, so only the cross-compiled
          # libraries are staged here.
          stage() { mkdir -p "$(dirname "$2")"; cp "$1" "$2"; }

          stage artifacts/native-jni-linux-x64/libsimdjson_jni.so   simdjson-native/build-jvm-linux-x64/libsimdjson_jni.so
          stage artifacts/native-jni-linux-arm64/libsimdjson_jni.so simdjson-native/build-jvm-linux-arm64/libsimdjson_jni.so
          stage artifacts/native-jni-windows-x64/simdjson_jni.dll   simdjson-native/build-jvm-windows-x64/simdjson_jni.dll
          stage artifacts/native-kn-linux-x64/libsimdjson_c.a       simdjson-native/build-linux-x64/libsimdjson_c.a

          stage artifacts/native-android/build-android-arm64-v8a/libsimdjson_jni.so simdjson-kotlin/src/androidMain/jniLibs/arm64-v8a/libsimdjson_jni.so
          stage artifacts/native-android/build-android-x86_64/libsimdjson_jni.so    simdjson-kotlin/src/androidMain/jniLibs/x86_64/libsimdjson_jni.so

      - name: Publish
        run: ./gradlew publishToMavenCentral -Psimdjson.allTargets=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
