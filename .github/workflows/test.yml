name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-vector-tests:
    name: JVM — Vector API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run JVM tests (Vector API backend)
        run: ./gradlew :simdjson-kotlin:jvmTest
      - name: Run JVM tests (Vector API backend, 128-bit species)
        run: ./gradlew :simdjson-kotlin:jvmTest128

  jvm-jni-tests:
    name: JVM — JNI backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run JVM tests (JNI backend)
        run: ./gradlew :simdjson-kotlin:jvmTestJni

  native-tests:
    name: Native — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosArm64Test
            runner: macos-14
          - target: linuxX64Test
            runner: ubuntu-22.04
            cxx: g++-10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Kotlin/Native's linuxX64 sysroot ships an old libstdc++ without
      # std::__throw_bad_array_new_length (GLIBCXX_3.4.29 / GCC 11+). Build the C++
      # cinterop static lib with g++-10 so that symbol is never referenced and ld.lld links.
      - name: Install g++-10 (Kotlin/Native-compatible C++ toolchain)
        if: matrix.cxx
        run: |
          sudo apt-get update && sudo apt-get install -y g++-10
          echo "CXX=g++-10" >> "$GITHUB_ENV"
      - name: Run native tests
        run: ./gradlew :simdjson-kotlin:${{ matrix.target }}

  ios-simulator-test:
    name: iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run iOS simulator tests
        run: ./gradlew :simdjson-kotlin:iosSimulatorArm64Test

  android-host-test:
    name: Android Host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android host tests
        run: ./gradlew :simdjson-kotlin:testAndroidHostTest

  serialization-tests:
    name: Serialization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run serialization tests
        run: ./gradlew :simdjson-kotlin-serialization:allTests

  consumer-integration-test:
    name: Consumer Integration — ${{ matrix.classifier }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            classifier: linux-x64
          - runner: macos-14
            classifier: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish library + JNI runtime to mavenLocal (host native only)
        run: >
          ./gradlew
          :simdjson-kotlin:publishJvmPublicationToMavenLocal
          :simdjson-kotlin:publishJniRuntimePublicationToMavenLocal
      - name: Consume from mavenLocal — auto-resolution (fat jar)
        run: ./gradlew -p integration-test run -PsimdjsonVersion=0.1.0
      - name: Consume from mavenLocal — manual classifier override
        run: ./gradlew -p integration-test run -PsimdjsonVersion=0.1.0 -PpinClassifier=${{ matrix.classifier }}
