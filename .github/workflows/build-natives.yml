name: Build Natives

on:
  push:
    branches: [master]
    paths: [simdjson-native/**]
  pull_request:
    paths: [simdjson-native/**]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-natives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # JNI shared libs (4 platforms)
          - runner: macos-14
            task: ":simdjson-kotlin:buildSimdjsonJniDesktop"
            artifact: native-jni-macos-arm64
            output: simdjson-native/build-jvm-macos-arm64/libsimdjson_jni.dylib

          - runner: ubuntu-latest
            task: ":simdjson-kotlin:buildSimdjsonJniDesktop"
            artifact: native-jni-linux-x64
            output: simdjson-native/build-jvm-linux-x64/libsimdjson_jni.so

          - runner: ubuntu-24.04-arm
            task: ":simdjson-kotlin:buildSimdjsonJniDesktop"
            artifact: native-jni-linux-arm64
            output: simdjson-native/build-jvm-linux-arm64/libsimdjson_jni.so

          - runner: windows-latest
            task: ":simdjson-kotlin:buildSimdjsonJniDesktop"
            artifact: native-jni-windows-x64
            output: simdjson-native/build-jvm-windows-x64/simdjson_jni.dll

          # Kotlin/Native static libs
          - runner: macos-14
            task: ":simdjson-kotlin:buildSimdjsonNativeMacosArm64"
            artifact: native-kn-macos-arm64
            output: simdjson-native/build/libsimdjson_c.a

          - runner: ubuntu-22.04
            task: ":simdjson-kotlin:buildSimdjsonNativeLinuxX64"
            artifact: native-kn-linux-x64
            output: simdjson-native/build-linux-x64/libsimdjson_c.a
            cxx: g++-10

          # iOS — both targets in one build
          - runner: macos-14
            task: ":simdjson-kotlin:buildSimdjsonNativeIos"
            artifact: native-kn-ios
            output: |
              simdjson-native/build-ios-arm64/libsimdjson_c.a
              simdjson-native/build-ios-simulator-arm64/libsimdjson_c.a

          # Android — both ABIs in one build
          - runner: ubuntu-latest
            task: ":simdjson-kotlin:buildSimdjsonJni"
            artifact: native-android
            output: |
              simdjson-native/build-android-arm64-v8a/libsimdjson_jni.so
              simdjson-native/build-android-x86_64/libsimdjson_jni.so

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native's linuxX64 sysroot ships an old libstdc++ without
      # std::__throw_bad_array_new_length (GLIBCXX_3.4.29 / GCC 11+). Build with g++-10.
      - name: Install g++-10 (Kotlin/Native-compatible C++ toolchain)
        if: matrix.cxx
        run: |
          sudo apt-get update && sudo apt-get install -y g++-10
          echo "CXX=g++-10" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew ${{ matrix.task }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
